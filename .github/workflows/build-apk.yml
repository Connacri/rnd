name: rnd-ci

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: stable

jobs:
  ##############################################################################
  # Calcule la prochaine version à partir des tags git existants (vX.Y.Z)
  ##############################################################################
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: v
        run: |
          git fetch --tags --force
          LAST_TAG=$(git tag -l "v*" | sort -V | tail -n1)
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v1.0.0"
          fi
          VERSION=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Incrémente jusqu'à trouver un tag qui n'existe pas encore
          while : ; do
            PATCH=$((PATCH + 1))
            CANDIDATE="$MAJOR.$MINOR.$PATCH"
            if ! git tag -l "v$CANDIDATE" | grep -q .; then
              break
            fi
          done

          echo "version=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "Version calculée : $CANDIDATE"

  ##############################################################################
  # Qualité : analyse statique + tests (bloque le build si échec)
  ##############################################################################
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  ##############################################################################
  # Build Android APK (signé avec le keystore issu des secrets GitHub)
  ##############################################################################
  build-android:
    needs: [version, quality]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            echo "Keystore décodé depuis le secret"
          else
            echo "⚠️  Aucun secret ANDROID_KEYSTORE_BASE64 : signature debug utilisée"
          fi

      - name: Create key.properties
        run: |
          if [ -f android/app/upload-keystore.jks ]; then
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
            echo "✅ key.properties créé (signature release)"
          else
            echo "⚠️  key.properties non créé : signature debug utilisée"
          fi

      # Seule la clé anon (publique par design) est injectée dans le build
      # client. La service_role key ne doit JAMAIS être passée ici.
      - name: Build APK (universal)
        run: |
          flutter build apk --release \
            --build-name=${{ needs.version.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if unzip -l "$APK" | grep -q "META-INF/"; then
            echo "✅ APK signé — certificat :"
            keytool -printcert -jarfile "$APK" 2>&1 | grep -E "Owner|Issuer" || true
          else
            echo "❌ APK NON signé !"
            exit 1
          fi

      - name: Prepare artifact
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
             release/rnd-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/rnd-android.apk
          retention-days: 30

  ##############################################################################
  # Build Windows (ZIP portable)
  ##############################################################################
  build-windows:
    needs: [version, quality]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        shell: pwsh
        run: |
          flutter build windows --release `
            --build-name=${{ needs.version.outputs.version }} `
            --build-number=${{ github.run_number }} `
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} `
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $VERSION = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path release
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "release\rnd-windows-v$VERSION.zip"

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: release/rnd-windows-v*.zip
          retention-days: 30

  ##############################################################################
  # Tag + Release GitHub avec tous les artefacts
  ##############################################################################
  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [version, build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: List artifacts
        run: ls -la out/

      - name: Create Git Tag
        run: |
          git fetch --tags --force
          TAG="v${{ needs.version.outputs.version }}"
          if git tag -l "$TAG" | grep -q .; then
            echo "Le tag $TAG existe déjà, on saute"
          else
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: RND Campagne v${{ needs.version.outputs.version }}
          body: |
            ## RND Campagne v${{ needs.version.outputs.version }}

            Application de campagne municipale — Nabil Zenasni, Aïn El Turck.

            ### 📦 Téléchargements
            | Plateforme | Fichier |
            |------------|---------|
            | 📱 Android | `rnd-android.apk` |
            | 🪟 Windows (portable) | `rnd-windows-v${{ needs.version.outputs.version }}.zip` |

            ### 🔐 Sécurité
            - Clés Supabase injectées via GitHub Secrets au moment du build (aucune clé committée dans le code)
            - APK signé avec le keystore de release (voir secrets `ANDROID_KEYSTORE_*`)
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
