name: rnd-ci

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  ##############################################################################
  # Calcule la prochaine version à partir des tags git existants (vX.Y.Z)
  ##############################################################################
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: v
        run: |
          git fetch --tags --force
          LAST_TAG=$(git tag -l "v*" | sort -V | tail -n1)
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v1.0.0"
          fi
          VERSION=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Incrémente jusqu'à trouver un tag qui n'existe pas encore
          while : ; do
            PATCH=$((PATCH + 1))
            CANDIDATE="$MAJOR.$MINOR.$PATCH"
            if ! git tag -l "v$CANDIDATE" | grep -q .; then
              break
            fi
          done

          echo "version=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "Version calculée : $CANDIDATE"

  ##############################################################################
  # Qualité : format + analyse statique + tests (bloque le build si échec)
  ##############################################################################
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib tool

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  ##############################################################################
  # Build Android APK (signé avec le keystore issu des secrets GitHub)
  ##############################################################################
  build-android:
    needs: [version, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            echo "Keystore décodé depuis le secret"
          else
            echo "⚠️  Aucun secret ANDROID_KEYSTORE_BASE64 : signature debug utilisée"
          fi

      - name: Create key.properties
        run: |
          if [ -f android/app/upload-keystore.jks ]; then
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
            echo "✅ key.properties créé (signature release)"
          else
            echo "⚠️  key.properties non créé : signature debug utilisée"
          fi

      # Les clés sont injectées via un fichier dart-define temporaire (supprimé
      # après build) plutôt qu'en ligne de commande, pour éviter qu'elles
      # n'apparaissent dans les logs de processus.
      - name: Create dart-define file
        run: |
          cat > /tmp/ci_env.json <<EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}"
          }
          EOF

      - name: Build APK (universal)
        run: |
          flutter build apk --release \
            --build-name=${{ needs.version.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define-from-file=/tmp/ci_env.json

      - name: Build App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --build-name=${{ needs.version.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define-from-file=/tmp/ci_env.json

      - name: Clean up secrets file
        if: always()
        run: rm -f /tmp/ci_env.json android/app/upload-keystore.jks android/key.properties

      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if unzip -l "$APK" | grep -q "META-INF/"; then
            echo "✅ APK signé — certificat :"
            keytool -printcert -jarfile "$APK" 2>&1 | grep -E "Owner|Issuer" || true
          else
            echo "❌ APK NON signé !"
            exit 1
          fi

      - name: Prepare artifact
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
             release/rnd-android.apk
          cp build/app/outputs/bundle/release/app-release.aab \
             release/rnd-android.aab

      - name: Generate SHA256 checksums
        run: |
          cd release
          sha256sum rnd-android.apk rnd-android.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/rnd-android.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: release/rnd-android.aab
          retention-days: 30

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: android-checksums
          path: release/SHA256SUMS.txt
          retention-days: 30

  ##############################################################################
  # Build Windows (ZIP portable)
  ##############################################################################
  build-windows:
    needs: [version, quality]
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create dart-define file
        shell: pwsh
        run: |
          $env = @{
            SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"
            SUPABASE_ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}"
          } | ConvertTo-Json
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\ci_env.json", $env)

      - name: Build Windows
        shell: pwsh
        run: |
          flutter build windows --release `
            --build-name=${{ needs.version.outputs.version }} `
            --build-number=${{ github.run_number }} `
            --dart-define-from-file="$env:RUNNER_TEMP\ci_env.json"

      - name: Clean up secrets file
        if: always()
        shell: pwsh
        run: Remove-Item -Force "$env:RUNNER_TEMP\ci_env.json" -ErrorAction SilentlyContinue

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $VERSION = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path release
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "release\rnd-windows-v$VERSION.zip"

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: release/rnd-windows-v*.zip
          retention-days: 30

  ##############################################################################
  # Tag + Release GitHub avec tous les artefacts
  ##############################################################################
  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [version, build-android, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: List artifacts
        run: ls -la out/

      - name: Create Git Tag
        run: |
          git fetch --tags --force
          TAG="v${{ needs.version.outputs.version }}"
          if git tag -l "$TAG" | grep -q .; then
            echo "Le tag $TAG existe déjà, on saute"
          else
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: RND Campagne v${{ needs.version.outputs.version }}
          body: |
            ## RND Campagne v${{ needs.version.outputs.version }}

            Application de campagne municipale — Nabil Zenasni, Aïn El Turck.

            ### 📦 Téléchargements
            | Plateforme | Fichier |
            |------------|---------|
            | 📱 Android (APK) | `rnd-android.apk` |
            | 📱 Android (AAB) | `rnd-android.aab` |
            | 🪟 Windows (portable) | `rnd-windows-v${{ needs.version.outputs.version }}.zip` |

            ### 🔐 Sécurité
            - Clés injectées via fichier temporaire au moment du build (jamais dans les logs)
            - APK signé avec le keystore de release (voir secrets `ANDROID_KEYSTORE_*`)
            - Checksums SHA256 disponibles dans `android-checksums`
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
