name: rnd_campaign_app

description: Application campagne municipale Nabil Zenasni - Ain El Turck

environment:
  sdk: ">=3.6.0 <4.0.0"


dependencies:

  flutter:
    sdk: flutter


  # State management
  provider: ^6.1.5


  # Backend
  supabase_flutter: ^2.10.1


  # Authentication
  google_sign_in: ^7.2.0


  # UI
  google_fonts: ^8.2.0
  cached_network_image: ^3.4.1


  # Maps
  flutter_map: ^8.3.1
  latlong2: ^0.10.1


  # Utils
  intl: ^0.20.3
  uuid: ^4.5.1


  # Images
  image_picker: ^1.1.2


dev_dependencies:

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0



flutter:

  uses-material-design: true


  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/